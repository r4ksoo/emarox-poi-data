name: Copy live build to Cloudflare

# Manual: puts the build that is live on GitHub Pages onto Cloudflare Pages without
# rebuilding (first setup, or after a failed Cloudflare publish).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build/mirror.mjs --out dist
      - run: printf '/*\n  Access-Control-Allow-Origin: *\n' > dist/_headers
      # First run only: the project does not exist yet. Later runs fail here harmlessly.
      - name: Create the Pages project
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create emarox-poi --production-branch=main
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=emarox-poi --branch=main --commit-dirty=true
