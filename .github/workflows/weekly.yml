name: Weekly POI build

# Every Monday night: rebuild the data set from fresh OpenStreetMap extracts and the
# official lists, check it against the live build, publish to Cloudflare Pages (the copy
# the app reads first) and to GitHub Pages (its fallback).
# Any failed step leaves the previous build online; GitHub e-mails the owner.
on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install osmium==4.3.2
      - name: Unit tests
        run: node --test test/*.test.mjs
      - name: Extract POI from every country
        run: bash build/extract-all.sh work
      - name: Official sources
        run: node build/fetch-sources.mjs --out work/sources
      - name: Build tiles
        run: node build/build.mjs --raw work/raw --sources work/sources --out dist
      - name: Safety check against the live build
        run: node build/check.mjs --dist dist
      - name: Let the app read the data from another origin (Cloudflare Pages)
        run: printf '/*
  Access-Control-Allow-Origin: *
' > dist/_headers
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    env:
      CF_READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/download-artifact@v4
        if: env.CF_READY == 'true'
        with:
          name: dist
          path: dist
      # First run only: the project does not exist yet. Later runs fail here harmlessly.
      - name: Create the Pages project
        if: env.CF_READY == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create emarox-poi --production-branch=main
      - name: Publish to Cloudflare Pages
        if: env.CF_READY == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=emarox-poi --branch=main --commit-dirty=true
